:root{--void:#0a0620;--neon:#5ee4ff;--lila:#c48bff;--gold:#ffe2a0;--text:#f3fbff;color-scheme:dark}
html,body{margin:0;background:radial-gradient(ellipse at 70% 30%,#1c1250,#0a0620 70%);color:var(--text);min-height:100%}
body{font-family:"Pop","Segoe UI",system-ui,sans-serif;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 14px}
.stage{position:relative;width:100%;aspect-ratio:1672/941;border-radius:16px;overflow:hidden;container-type:inline-size;box-shadow:0 0 40px rgba(94,228,255,.18)}
.ki{position:absolute;left:1.4cqw;bottom:1.6cqw;width:4cqw;height:4cqw;min-width:30px;min-height:30px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font:700 max(13px,1.6cqw)/1 "Pop",sans-serif;letter-spacing:.04em;border:2px solid rgba(255,255,255,.85);z-index:6}
.btn{display:block;text-decoration:none;text-align:center;color:#fff;font:700 2.1cqw/1.15 "Pop",sans-serif;padding:1.3cqw 1.6cqw;border-radius:1.3cqw;
 background:linear-gradient(180deg,rgba(30,40,110,.86),rgba(14,14,60,.92));border:.2cqw solid var(--neon);
 box-shadow:0 0 1.2cqw rgba(94,228,255,.75),inset 0 0 1.2cqw rgba(94,228,255,.25);text-shadow:0 0 .7cqw rgba(94,228,255,.8);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-.2cqw) scale(1.02);box-shadow:0 0 2cqw rgba(94,228,255,1),inset 0 0 1.4cqw rgba(94,228,255,.35)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.btn.ob{border-color:var(--lila);box-shadow:0 0 1.2cqw rgba(196,139,255,.8),inset 0 0 1.2cqw rgba(196,139,255,.25);text-shadow:0 0 .7cqw rgba(196,139,255,.8)}
.more{font:700 2.2cqw/1.2 "Pop",sans-serif;text-align:center;color:var(--gold);transform:rotate(-4deg);text-shadow:0 0 1cqw rgba(255,190,80,.7),0 .2cqw .4cqw #000}
.more span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.4cqw)}}
@media (prefers-reduced-motion:reduce){.more span{animation:none}.btn{transition:none}}
footer{text-align:right;color:#a9b6dd;font-size:.85rem;padding-top:8px}

.img{position:absolute;inset:0;background-size:100% 100%}
.back{position:absolute;left:1.6cqw;top:1.6cqw;z-index:5;text-decoration:none;color:#fff;font:700 1.1cqw "Pop";padding:.6cqw 1.1cqw;border-radius:999px;background:rgba(10,8,40,.7);border:1px solid rgba(94,228,255,.6);box-shadow:0 0 1cqw rgba(94,228,255,.4)}
.back:hover{background:rgba(30,30,90,.85)}.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.panel{position:absolute;left:72%;right:2.2%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.5cqw;z-index:4;padding:2cqw 1.6cqw 2.4cqw;border-radius:1.6cqw;background:rgba(12,8,44,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(94,228,255,.4);box-shadow:0 0 2.5cqw rgba(0,0,0,.5),0 0 1.4cqw rgba(94,228,255,.25)}
.lvl{text-align:center}.lvl .k{font:700 1cqw "Pop";letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 .8cqw rgba(255,190,80,.6)}
.list .btn{font-size:1.75cqw;padding:1.2cqw 1cqw;overflow-wrap:anywhere;hyphens:auto}
.lvl h1{margin:.2cqw 0 .6cqw;font:700 3.6cqw/1.05 "Pop";color:#eafcff;text-shadow:0 0 .4cqw #fff,0 0 1.1cqw var(--neon),0 0 2.6cqw #7a5cff}
.list{display:flex;flex-direction:column;gap:1.2cqw}
.more{margin-top:.8cqw}
.cfoot{position:absolute;left:7cqw;right:1.6cqw;bottom:.9cqw;z-index:6;display:flex;justify-content:space-between;gap:2cqw;font:500 .8cqw/1.3 "Pop",sans-serif;color:#fff;text-shadow:0 0 .4cqw #000,0 .1cqw .3cqw #000}.cfoot span:last-child{text-align:right}
@media (max-width:700px){.stage{aspect-ratio:auto}.img{position:relative;aspect-ratio:1672/941;background-size:136% 100%;background-position:0 0}
 .back{font-size:13px;padding:6px 12px;left:10px;top:10px}.panel{position:relative;left:auto;right:auto;top:auto;transform:none;border-radius:0;border:0;padding:22px 16px 30px;gap:16px;background:linear-gradient(180deg,#140c3a,#0a0620)}
